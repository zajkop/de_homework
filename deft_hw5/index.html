<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEFT HW5 – Notebooki (01–10)</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #1f2630;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #2f81f7;
      --accent-hover: #388bfd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title-group h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .title-group p {
      margin: 2px 0 0;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 0.85rem;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn:hover {
      background: #28313e;
      border-color: #484f58;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 500;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .layout {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    aside {
      width: 250px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 4px;
      padding: 0 8px;
    }

    .notebook-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 6px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.92rem;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }

    .notebook-link:hover {
      background: var(--panel-2);
    }

    .notebook-link.active {
      background: rgba(47, 129, 247, 0.16);
      border-color: rgba(47, 129, 247, 0.45);
      color: #79c0ff;
      font-weight: 600;
    }

    .viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #ffffff;
    }

    .viewer-bar {
      background: var(--panel);
      color: var(--text);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
    }

    .viewer-bar code {
      color: #79c0ff;
      background: var(--panel-2);
      padding: 2px 6px;
      border-radius: 4px;
    }

    iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #ffffff;
    }

    @media (max-width: 768px) {
      body {
        height: auto;
        min-height: 100vh;
      }
      .layout {
        flex-direction: column;
      }
      aside {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border);
        flex-direction: row;
        flex-wrap: wrap;
      }
      .nav-label {
        width: 100%;
      }
      .viewer {
        height: 75vh;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>DEFT HW5 — Zestaw notebooków (01–10)</h1>
      <p>Kliknij numer notatnika, aby przełączyć podgląd lub otworzyć go osobno</p>
    </div>
    <div class="actions">
      <a id="openRawBtn" class="btn btn-primary" href="01_notebook.html" target="_blank" rel="noopener noreferrer">
        Otwórz aktualny w nowej karcie ↗
      </a>
    </div>
  </header>

  <div class="layout">
    <aside aria-label="Lista notebooków">
      <div class="nav-label">Pliki notebooków</div>
      <div id="navList" style="display:flex; flex-direction:column; gap:6px; width:100%;"></div>
    </aside>

    <main class="viewer">
      <div class="viewer-bar">
        <span>Aktualny plik: <code id="currentFileLabel">01_notebook.html</code></span>
        <span style="color: var(--muted);">Skórka: podgląd osadzony</span>
      </div>
      <iframe id="notebookFrame" src="01_notebook.html" title="Podgląd notebooka"></iframe>
    </main>
  </div>

  <script>
    const totalNotebooks = 10;
    const navList = document.getElementById('navList');
    const frame = document.getElementById('notebookFrame');
    const currentFileLabel = document.getElementById('currentFileLabel');
    const openRawBtn = document.getElementById('openRawBtn');

    function getFileName(num) {
      return `${String(num).padStart(2, '0')}_notebook.html`;
    }

    function selectNotebook(num, updateHash = true) {
      const fileName = getFileName(num);
      frame.src = fileName;
      currentFileLabel.textContent = fileName;
      openRawBtn.href = fileName;

      document.querySelectorAll('.notebook-link').forEach((el) => {
        el.classList.toggle('active', Number(el.dataset.num) === num);
      });

      if (updateHash) {
        history.replaceState(null, '', `#${String(num).padStart(2, '0')}`);
      }
    }

    for (let i = 1; i <= totalNotebooks; i++) {
      const fileName = getFileName(i);
      const link = document.createElement('a');
      link.href = `#${String(i).padStart(2, '0')}`;
      link.className = 'notebook-link';
      link.dataset.num = i;
      link.innerHTML = `<span>Notebook ${String(i).padStart(2, '0')}</span><span style="color:var(--muted); font-size:0.78rem;">${fileName}</span>`;

      link.addEventListener('click', (e) => {
        e.preventDefault();
        selectNotebook(i, true);
      });

      navList.appendChild(link);
    }

    const initialHash = Number(window.location.hash.replace('#', ''));
    const initialNum = initialHash >= 1 && initialHash <= totalNotebooks ? initialHash : 1;
    selectNotebook(initialNum, false);
  </script>
</body>
</html>
