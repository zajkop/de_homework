<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEFT HW5 — Notebooki (01–10)</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: rgba(17, 24, 39, 0.88);
      --surface-elevated: #162033;
      --surface-hover: #1e2b45;
      --border: rgba(148, 163, 184, 0.14);
      --border-strong: rgba(96, 165, 250, 0.45);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.16);
      --accent-glow: rgba(59, 130, 246, 0.28);
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 7px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(59, 130, 246, 0.14), transparent 36%),
        radial-gradient(circle at 88% 8%, rgba(99, 102, 241, 0.10), transparent 32%),
        var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      height: 64px;
      padding: 0 22px;
      background: var(--surface);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: #fff;
      box-shadow: 0 6px 20px var(--accent-glow);
      flex-shrink: 0;
    }

    .brand-text h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 650;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-text p {
      margin: 1px 0 0;
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 8px 13px;
      font-size: 0.82rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.16s ease;
    }

    .btn:hover:not(:disabled) {
      background: var(--surface-hover);
      border-color: rgba(148, 163, 184, 0.3);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border-color: rgba(147, 197, 253, 0.35);
      color: #fff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.32);
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      border-color: rgba(191, 219, 254, 0.55);
    }

    .workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 14px;
      padding: 14px;
    }

    .sidebar {
      background: var(--surface);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
    }

    .sidebar-title {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .counter-pill {
      font-size: 0.75rem;
      font-weight: 600;
      color: #93c5fd;
      background: var(--accent-soft);
      border: 1px solid rgba(96, 165, 250, 0.25);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .progress-track {
      height: 4px;
      background: rgba(148, 163, 184, 0.12);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-fill {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, #3b82f6, #818cf8);
      border-radius: 999px;
      transition: width 0.22s ease;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .nav-list::-webkit-scrollbar {
      width: 6px;
    }

    .nav-list::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.2);
      border-radius: 999px;
    }

    .nb-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 11px;
      border-radius: var(--radius-md);
      text-decoration: none;
      color: var(--text);
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }

    .nb-item:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--border);
    }

    .nb-item.active {
      background: var(--accent-soft);
      border-color: var(--border-strong);
      box-shadow: inset 0 0 0 1px rgba(96, 165, 250, 0.14);
    }

    .nb-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .nb-num {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      font-size: 0.78rem;
      font-weight: 700;
      background: rgba(148, 163, 184, 0.1);
      color: var(--muted);
      flex-shrink: 0;
    }

    .nb-item.active .nb-num {
      background: var(--accent);
      color: #fff;
    }

    .nb-label {
      font-size: 0.88rem;
      font-weight: 550;
      white-space: nowrap;
    }

    .nb-item.active .nb-label {
      color: #bfdbfe;
    }

    .nb-file {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.73rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 0.74rem;
      color: var(--muted);
      line-height: 1.45;
    }

    .kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.7rem;
      color: var(--text);
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      padding: 1px 5px;
      border-radius: 5px;
    }

    .viewer-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .viewer-toolbar {
      height: 48px;
      padding: 0 16px;
      background: rgba(15, 23, 42, 0.92);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .file-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.65);
      flex-shrink: 0;
    }

    .file-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.82rem;
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(96, 165, 250, 0.25);
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .viewer-hint {
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .frame-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #ffffff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #ffffff;
    }

    @media (max-width: 900px) {
      body {
        height: auto;
        min-height: 100vh;
        overflow: auto;
      }

      .workspace {
        grid-template-columns: 1fr;
        padding: 10px;
        gap: 10px;
      }

      .sidebar {
        padding: 12px;
      }

      .nav-list {
        flex-direction: row;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .nb-item {
        flex-shrink: 0;
      }

      .nb-file,
      .sidebar-footer,
      .viewer-hint {
        display: none;
      }

      .viewer-card {
        height: 78vh;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-badge">HW5</div>
      <div class="brand-text">
        <h1>DEFT HW5 — Notebooki (01–10)</h1>
        <p>Interaktywny podgląd wszystkich plików z zestawu</p>
      </div>
    </div>

    <div class="topbar-actions">
      <button id="prevBtn" class="btn" type="button" title="Poprzedni notebook (←)">← Poprzedni</button>
      <button id="nextBtn" class="btn" type="button" title="Następny notebook (→)">Następny →</button>
      <a id="openTabBtn" class="btn btn-primary" href="01_notebook.html" target="_blank" rel="noopener noreferrer">
        Otwórz w karcie ↗
      </a>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar" aria-label="Lista notebooków">
      <div class="sidebar-header">
        <span class="sidebar-title">Notebooki</span>
        <span id="counterPill" class="counter-pill">1 / 10</span>
      </div>

      <div class="progress-track" aria-hidden="true">
        <div id="progressFill" class="progress-fill"></div>
      </div>

      <nav id="navList" class="nav-list"></nav>

      <div class="sidebar-footer">
        Skróty: <span class="kbd">←</span> <span class="kbd">→</span> zmiana pliku, <span class="kbd">1</span>–<span class="kbd">9</span> oraz <span class="kbd">0</span> (10) szybki wybór.
      </div>
    </aside>

    <main class="viewer-card">
      <div class="viewer-toolbar">
        <div class="file-meta">
          <span class="dot" aria-hidden="true"></span>
          <code id="fileCode" class="file-code">01_notebook.html</code>
        </div>
        <span class="viewer-hint">Jeśli notatnik w ramce nie ładuje się poprawnie, użyj „Otwórz w karcie ↗”</span>
      </div>

      <div class="frame-wrap">
        <iframe id="notebookFrame" src="01_notebook.html" title="Podgląd notebooka"></iframe>
      </div>
    </main>
  </div>

  <script>
    const TOTAL = 10;
    const navList = document.getElementById('navList');
    const frame = document.getElementById('notebookFrame');
    const fileCode = document.getElementById('fileCode');
    const openTabBtn = document.getElementById('openTabBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const counterPill = document.getElementById('counterPill');
    const progressFill = document.getElementById('progressFill');

    let currentNum = 1;

    function pad(num) {
      return String(num).padStart(2, '0');
    }

    function fileNameFor(num) {
      return `${pad(num)}_notebook.html`;
    }

    function selectNotebook(num, syncHash = true) {
      if (num < 1 || num > TOTAL) return;
      currentNum = num;

      const file = fileNameFor(num);
      frame.src = file;
      fileCode.textContent = file;
      openTabBtn.href = file;
      counterPill.textContent = `${num} / ${TOTAL}`;
      progressFill.style.width = `${(num / TOTAL) * 100}%`;

      prevBtn.disabled = num === 1;
      nextBtn.disabled = num === TOTAL;

      document.querySelectorAll('.nb-item').forEach((el) => {
        const active = Number(el.dataset.num) === num;
        el.classList.toggle('active', active);
        if (active) {
          el.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
        }
      });

      if (syncHash) {
        history.replaceState(null, '', `#${pad(num)}`);
      }
    }

    for (let i = 1; i <= TOTAL; i++) {
      const a = document.createElement('a');
      a.href = `#${pad(i)}`;
      a.className = 'nb-item';
      a.dataset.num = String(i);
      a.innerHTML = `
        <span class="nb-left">
          <span class="nb-num">${pad(i)}</span>
          <span class="nb-label">Notebook ${pad(i)}</span>
        </span>
        <span class="nb-file">${fileNameFor(i)}</span>
      `;
      a.addEventListener('click', (e) => {
        e.preventDefault();
        selectNotebook(i, true);
      });
      navList.appendChild(a);
    }

    prevBtn.addEventListener('click', () => selectNotebook(currentNum - 1, true));
    nextBtn.addEventListener('click', () => selectNotebook(currentNum + 1, true));

    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;

      if (e.key === 'ArrowLeft') {
        selectNotebook(currentNum - 1, true);
      } else if (e.key === 'ArrowRight') {
        selectNotebook(currentNum + 1, true);
      } else if (e.key >= '1' && e.key <= '9') {
        selectNotebook(Number(e.key), true);
      } else if (e.key === '0') {
        selectNotebook(10, true);
      }
    });

    const hashNum = Number(window.location.hash.replace('#', ''));
    const startNum = hashNum >= 1 && hashNum <= TOTAL ? hashNum : 1;
    selectNotebook(startNum, false);
  </script>
</body>
</html>
